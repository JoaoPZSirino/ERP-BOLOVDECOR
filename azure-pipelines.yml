trigger:
- contrato

# Roda na nuvem oficial da Microsoft (onde o Visual Studio já está pronto)
pool:
  vmImage: 'windows-latest'

variables:
  projectFile: 'ERPBOLOV2/ERPBOLOV2.csproj'
  packagesConfig: 'ERPBOLOV2/packages.config'
  buildPlatform: 'AnyCPU'                     # <-- Sem espaço, corrigido!
  buildConfiguration: 'Release'

steps:
# 1. Ferramenta NuGet
- task: NuGetToolInstaller@1
  inputs:
    versionSpec: '6.x'

# 2. Restaurar dependências
- task: NuGetCommand@2
  displayName: 'Restore NuGet Packages'
  inputs:
    restoreSolution: '$(packagesConfig)'
    restoreDirectory: '$(Build.SourcesDirectory)/packages'

# 3. Compilar o ERPBOLOV2
- task: VSBuild@1
  displayName: 'Build ERPBOLOV2'
  inputs:
    solution: '$(projectFile)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

# 4. Copiar os arquivos gerados
- task: CopyFiles@2
  displayName: 'Copy Build Output'
  inputs:
    SourceFolder: 'ERPBOLOV2/bin/$(buildConfiguration)'
    Contents: '**'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

# 5. Publicar o executável para download
- task: PublishBuildArtifacts@1
  displayName: 'Publish ERPBOLOV2 Executable'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'ERPBOLOV2-Release'
    publishLocation: 'Container'